/* PulseGrid premium landing + peak-hour heatmap + SOS flow */
.hero{position:relative;overflow:hidden;padding:28px;border:1px solid #1b5063;border-radius:20px;background:radial-gradient(circle at 82% 15%,#164e63 0,transparent 32%),linear-gradient(120deg,#0d1b2a,#101b2b 55%,#101e30);box-shadow:0 18px 55px #0005;margin-bottom:14px}
.hero:after{content:"";position:absolute;width:260px;height:260px;right:-75px;bottom:-145px;border:1px solid #19e6ff44;border-radius:50%;box-shadow:0 0 0 25px #19e6ff08,0 0 0 55px #19e6ff06}
.hero .eyebrow{font:700 10px Consolas,monospace;letter-spacing:.2em;color:var(--cy);text-transform:uppercase}
.hero h1{font-size:clamp(28px,4vw,44px);line-height:1.04;letter-spacing:-.04em;margin:12px 0;max-width:650px;color:#f0f7ff}
.hero p{font-size:14px;color:#9eb4cc;max-width:650px;line-height:1.7}
.hero-actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:18px}.hero-actions .btn{width:auto;margin:0;padding:11px 16px}
.glow{box-shadow:0 0 24px #19e6ff26}.section-title{display:flex;justify-content:space-between;align-items:end;gap:10px;margin:18px 0 9px}.section-title h2{margin:0;color:#d8e7f6;font-size:12px}.section-title span{font-size:11px;color:var(--mut)}
.heat-wrap{overflow:auto}.heat{border-collapse:separate;border-spacing:4px;min-width:650px}.heat th{border:0;padding:6px 8px}.heat td{height:31px;text-align:center;border:1px solid #23354a;border-radius:5px;font:11px Consolas,monospace;color:#eaf4ff;min-width:35px}.heat .rowname{min-width:135px;text-align:left;background:#111e2c;border:0;font:600 11px 'Segoe UI',sans-serif}.heat-legend{display:flex;align-items:center;gap:7px;flex-wrap:wrap;color:var(--mut);font-size:11px;margin-top:10px}.heat-legend i{display:inline-block;width:15px;height:12px;border-radius:3px}
.feature-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:12px 0}.feature{background:linear-gradient(145deg,#111f2e,#0c1520);border:1px solid #1e3044;border-radius:14px;padding:15px}.feature .ico{font-size:23px;margin-bottom:9px}.feature b{display:block;font-size:14px;margin-bottom:4px}.feature p{color:var(--mut);font-size:12px;margin:0;line-height:1.6}
.sos-nav{background:linear-gradient(100deg,#571a25,#29121b)!important;border:1px solid #a43d4b!important;color:#ffd9dd!important;font-weight:800!important;letter-spacing:.02em}.sos-nav:hover{box-shadow:0 0 22px #ff5b5b22;transform:translateY(-1px)}

.sos-capacity{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px;margin:14px 0 10px}.sos-capacity>div{background:rgba(255,255,255,.035);border:1px solid var(--line);border-radius:12px;padding:12px}.sos-capacity b{display:block;font-size:25px;line-height:1.3;color:var(--cy);margin-top:4px}.sos-capacity small{display:block;color:var(--mut);font-size:11px;margin-top:3px}@media(max-width:650px){.sos-capacity{grid-template-columns:1fr}}

@media(max-width:800px){.feature-grid{grid-template-columns:1fr}.hero{padding:20px}.hero h1{font-size:30px}}

/* Motion polish and bed preference controls */
:root{--font-display: "Avenir Next", "Segoe UI", sans-serif}
h1,.hero h1,.sos-hero h1{font-family:var(--font-display);letter-spacing:-.045em;font-weight:760}
.card,.stat,.feature,.home-choice,.rec,.sos-hero{animation:riseIn .48s cubic-bezier(.2,.7,.2,1) both}
.card:nth-child(2),.stat:nth-child(2){animation-delay:.04s}.card:nth-child(3),.stat:nth-child(3){animation-delay:.08s}.card:nth-child(4),.stat:nth-child(4){animation-delay:.12s}
.btn,.nv,.cat,.sub,.zn,.bed-pick{transition:transform .22s ease,border-color .22s ease,background .22s ease,box-shadow .22s ease}
.btn:hover,.home-choice:hover,.bed-pick:hover{transform:translateY(-2px);box-shadow:0 10px 28px #19e6ff18}
.sos-hero{position:relative;overflow:hidden}.sos-hero:after{content:"";position:absolute;width:240px;height:240px;border:1px solid #ff5b5b22;border-radius:50%;right:-75px;top:-90px;box-shadow:0 0 0 24px #ff5b5b08,0 0 0 52px #ff5b5b06;pointer-events:none}
.bed-picks{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px;margin:7px 0 12px}.bed-pick{display:flex;flex-direction:column;align-items:flex-start;gap:5px;background:#101b29;border:1px solid #26384d;border-radius:11px;padding:10px 9px;text-align:left}.bed-pick span{font-size:20px;color:var(--cy)}.bed-pick b{font-size:11px;line-height:1.25}.bed-pick.on2{background:linear-gradient(145deg,#0b303a,#101c2b)!important;box-shadow:0 0 20px #19e6ff13}
.hold-panel{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;margin-top:14px;padding:14px;border:1px solid #256b5c;background:linear-gradient(120deg,#0b2927,#101d2b);border-radius:13px}.hold-panel b,.hold-panel small{display:block}.hold-panel b{margin:4px 0;color:#b9ffdf}.hold-panel small{color:var(--mut);font-size:12px}.hold-btn{width:auto;min-width:180px;background:linear-gradient(110deg,#2de38a,#19e6ff);color:#04141a}.hold-btn:disabled{opacity:.35}@keyframes riseIn{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:translateY(0)}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}


/* PulseGrid editorial dashboard refresh */
:root{--bg:#f1f1f5;--pn:#fff;--pn2:#f5f6fa;--line:#e6e7ef;--tx:#20233f;--mut:#777d99;--cy:#4269e8;--g:#27a985;--a:#e9b840;--r:#f16a70;--font-display:Inter,"Avenir Next",system-ui,sans-serif}

function mk(sc,seed,pol){const st={sc,seed,pol,ev:build(sc,seed),H:clone(H0).map(h=>({...h,on:1,upd:0,prog:0,dw:0,di:0,ic0:h.bed.icu[0],arr:[]})),i:0,now:0,rec:[],au:[],feed:[],tl:[],br:0,bm:0,inB:{},dec:null,man:0};snap(st);st.H.forEach(h=>st.inB[h.name]=inB(h));return st}

function snap(st){st.tl.push({t:st.now,pk:Math.max(...st.H.map(h=>h.q)),q:st.H.map(h=>h.q)})}

function adj(h,k,d){const[g,n]=k.split("."),a=h[g][n];a[0]=Math.max(0,Math.min(a[1],a[0]+d))}

function pageDetail(st,d){const o=selO(d);if(!o)return`<div class="emp">No hospital selected. <button class="btn in" data-a="go" data-v="map">Back to map</button></div>`;const h=o.h,bed=d.bed,lk=U.locked&&U.locked.hosp==h.name;

// ---------- hospital control terminal ----------
function tview(){

 const off=H.filter(h=>!h.on).map(h=>h.name),sl=H.filter(h=>h.on&&stale(h,st.now)).map(h=>h.name);
 const nav=[["c","Capacity & Matrix"],["r","Baseline Replay"],["a","Advisory Audit Log"]].map(([k,l])=>`<button class="nv ${S.tab==k?"on":""}" data-a="tab" data-v="${k}">${l}</button>`).join("");

 if(S.tab=="c"){
  body=(hi.length?`<div class="alert e"><b>Surge risk: ${hi.map(h=>h.name).join(", ")}</b>${hi.map(h=>risk(h,st.now).f.join(", ")).join(" | ")}. Review diversion options. A human coordinator must sign off.</div>`:`<div class="alert n"><b>All facilities nominal</b>No hospital is at high surge risk right now.</div>`)
  +(off.length?`<div class="alert w">Offline and excluded from recommendations: ${off.join(", ")}</div>`:"")+(sl.length?`<div class="alert w">No recent status update from ${sl.join(", ")}. Data may be stale; they are ranked with a penalty.</div>`:"")
  +`<div class="cards">${H.map((x,i)=>hosp(st,x,i)).join("")}</div><div class="g2"><div><div class="card"><h2>Simulation</h2><select data-a="sc">${Object.keys(SC).map(k=>`<option ${k==S.sc?"selected":""}>${k}</option>`).join("")}</select><div class="hint">${SC[S.sc]}</div>
  <div class="two" style="margin-top:8px"><input type="number" min="1" max="9999" value="${S.seed}" data-a="seed" title="Random seed"><button class="btn s" style="margin:0" data-a="reset">Reset</button></div>
  <button class="btn" data-a="next" ${done?"disabled":""}>Next case</button><div class="two"><button class="btn s" data-a="ev1" ${done?"disabled":""}>Next event</button><button class="btn s" data-a="ev5" ${done?"disabled":""}>Next 5</button></div>
  <button class="btn s" data-a="auto" ${done?"disabled":""}>${S.auto?"⏸ Pause auto-run":"▶ Auto-run"}</button><div class="hint">Seconds per event <input type="range" min=".2" max="2" step=".1" value="${S.spd}" data-a="spd" style="width:100%"></div>
  <div class="prog"><i style="width:${st.i/st.ev.length*100}%"></i></div><div class="hint">Event ${st.i} of ${st.ev.length} · breaches so far: ${st.br}</div></div>
  <div class="card" style="margin-top:12px"><h2>Event feed</h2><div class="feed">${st.feed.length?[...st.feed].reverse().slice(0,16).map(e=>`<div class="fe ${e.c}"><span class="t">${tm(e.t)}</span><span>${e.x}</span></div>`).join(""):'<div class="emp">Events appear here, including bed-hold requests from the user screen.</div>'}</div></div></div>
  <div><div class="card"><h2>Queues over time (patients waiting)</h2>${lineChart(H.map((x,i)=>({n:x.name,c:COL[i],d:st.tl.map(r=>r.q[i])})),st.tl.map(r=>r.t))}</div><div style="margin-top:12px">${st.dec?recPanel(st,st.dec,false):'<div class="emp">Press <b>Next case</b> to see how the engine ranks hospitals for a simulated incoming case.</div>'}</div></div></div>`}
 else body=S.tab=="r"?replayView():auditView();
 return`<div class="shell"><aside><div class="lg"><div class="logo">∿</div><div><b>PulseGrid AI</b><small>Hospital control terminal</small></div></div><div class="tier"><span class="lab">Scenario</span><b>${S.sc}</b></div>${nav}

function render(){const a=$("#app"),y=window.scrollY;a.innerHTML=TERM?tview():uview();if(TERM)save();else{const l=$("#tl");if(l)l.href=location.href.split("#")[0]+"#terminal"}}

  return render()}
 if(!t)return;const a=t.dataset.a,v=t.dataset.v,i=+t.dataset.i,st=S.sim;

document.addEventListener("change",e=>{if(!TERM)return;const a=e.target.dataset.a;
